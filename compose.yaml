# mixmatch pe server: `docker compose up -d --build` din folderul repo-ului.
# Căile implicite sunt ale serverului homebox; se pot schimba într-un fișier .env alăturat.
# Folderele montate trebuie să existe înainte (altfel Docker le creează ca root).
name: mixmatch

services:
  mixmatch:
    build: .
    image: mixmatch:local
    container_name: mixmatch
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${MIXMATCH_PORT:-8090}:8000"
    volumes:
      # Baza SQLite și cache-ul (SSD).
      - ${MIXMATCH_APPDATA:-/opt/docker/appdata/mixmatch}:/data
      # Muzica (RAID); exporturile și importurile se scriu în /music/mixmatch.
      - ${MIXMATCH_MUSIC:-/srv/media/music}:/music
